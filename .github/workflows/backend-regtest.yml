name: Backend regtest (real infra)

# Dedicated regtest lane for the cat21-indexer BACKEND's sync clients
# (OrdClientService, ElectrsClientService). Runs `npm run test:regtest`
# — every `*.regtest.spec.ts` — against a REAL stack: bitcoind + our
# ordpool-electrs + cat21-ord, no mocks. Isolated in its own workflow so
# it can never turn the cat21-wallet money-path lane red, and vice versa.

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/src/modules/sync/**'
      - 'backend/jest.regtest.config.ts'
      - 'backend/*.json'
      - 'scripts/backend-regtest-lane.sh'
      - '.github/workflows/backend-regtest.yml'

permissions:
  contents: read

concurrency:
  group: cat21-indexer-backend-regtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-regtest:
    name: Backend sync clients vs real bitcoind + electrs + cat21-ord
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout cat21-indexer
        uses: actions/checkout@v4

      - name: Setup Node (backend)
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend deps (brings ordpool-sdk into node_modules)
        working-directory: backend
        run: npm ci

      # The stack's slot (ordpool-sdk e2e/stack-slots.ts): its host ports,
      # E2E_PREFIX and container names, exported to every later step. A runner
      # holds one stack, so this is slot 0. Held by the runner's worker process
      # ($PPID of a step), which lives for the job.
      - name: Acquire the regtest stack slot
        run: node backend/node_modules/ordpool-sdk/scripts/e2e-slots.mjs acquire --kind consumer --owner-pid "$PPID" --label "backend-regtest" --format github | tee -a "$GITHUB_ENV"

      # ordpool-electrs and cat21-ord build from the shas this SDK commit pins
      # (e2e/build-pins.env), read from the installed package so they match
      # package-lock.json. The SDK bootstrap fails under CI on a checkout at
      # another revision.
      - name: Read the SDK's build pins
        run: grep -E '^[A-Z0-9_]+=' backend/node_modules/ordpool-sdk/e2e/build-pins.env >> "$GITHUB_ENV"

      # OUR electrs: the consumer-environment compose builds it from the
      # ordpool-electrs fork; ELECTRS_SRC points its build context here.
      - name: Checkout ordpool-electrs (for the electrs container)
        uses: actions/checkout@v4
        with:
          repository: ordpool-space/ordpool-electrs
          ref: ${{ env.ORDPOOL_ELECTRS_SHA }}
          path: ordpool-electrs

      # cat21-ord: the REAL cat index the backend's OrdClientService reads.
      - name: Checkout cat21-ord (for the cat21-ord container)
        uses: actions/checkout@v4
        with:
          repository: ordpool-space/cat21-ord
          ref: ${{ env.CAT21_ORD_SHA }}
          path: cat21-ord

      # buildx gha cache: reuse the compiled Rust images across runs. A
      # docker-container builder + the Actions runtime env make type=gha work;
      # the .dockerignore keeps each checkout's volatile .git/ out of the COPY
      # layer so it cache-hits.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Export GitHub Actions runtime for the gha cache backend
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Stabilise the Rust build contexts for layer caching
        run: |
          printf '.git\ntarget\n' > ordpool-electrs/.dockerignore
          printf '.git\ntarget\n' > cat21-ord/.dockerignore

      # scripts/backend-regtest-lane.sh: the stack in this slot, one seeded
      # CAT-21 mint, then `npm run test:regtest`, whose specs read the slot's
      # ports. A local run executes the same script through
      # `e2e-slots.mjs run --kind consumer`.
      - name: Run the backend regtest lane
        env:
          ELECTRS_SRC: ${{ github.workspace }}/ordpool-electrs
          CAT21_ORD_SRC: ${{ github.workspace }}/cat21-ord
          E2E_BUILDX_CACHE: '1'
          E2E_LANE_DIR: ${{ github.workspace }}/lane
        run: scripts/backend-regtest-lane.sh

      - name: Dump container logs on failure
        if: failure() && env.E2E_SLOT != ''
        run: |
          for service in bitcoind electrs cat21-ord; do
            echo "===== $E2E_PREFIX-consumer-$service ====="
            docker logs "$E2E_PREFIX-consumer-$service" --tail 100 2>&1 || echo "(no container $E2E_PREFIX-consumer-$service)"
          done

      # Tears the slot's compose projects down by name and releases the slot.
      - name: Tear down
        if: always() && env.E2E_SLOT != ''
        run: node backend/node_modules/ordpool-sdk/scripts/e2e-slots.mjs down "$E2E_SLOT" --force
