name: Test Frontend

# The build-cat21-frontend workflow only runs on stage_prod and only compiles;
# it never ran the Jest unit suite, so a frontend regression could land on main
# and reach a deploy without any unit test firing in CI. This workflow gates
# every frontend push (main + stage_prod) and PR on the production build, the
# full Jest suite, AND a typecheck of the e2e specs. Playwright transpiles specs
# with esbuild, which never typechecks, so a type error in e2e/ (a dropped option
# silently ignored, an unknown-typed field read as an object) rides along green
# forever. `tsc --noEmit -p tsconfig.e2e.json` is the gate that makes those fail.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, stage_prod ]
    paths:
      - 'frontend/**'
      - '.github/workflows/test-frontend.yml'

# Harden installs against transient registry blips like ECONNRESET: retry more
# times over a longer backoff window than npm's default of 2. npm and pnpm both
# read these npm_config_* values.
env:
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"
  npm_config_fetch_timeout: "600000"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v6
      with:
        node-version: 26

    - name: Install dependencies
      working-directory: frontend
      run: npm ci --legacy-peer-deps

    - name: Duplicate check (jscpd)
      working-directory: frontend
      run: npm run dupes

    - name: Typecheck e2e specs (tsc, esbuild never does)
      working-directory: frontend
      run: npm run typecheck:e2e

    - name: Unit tests (Jest)
      working-directory: frontend
      run: npm test -- --coverage

    - name: Production build
      working-directory: frontend
      run: npm run build
