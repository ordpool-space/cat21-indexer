name: Build Backend

on:
  workflow_dispatch:
  push:
    branches: [ stage_prod ]
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'

# Harden installs against transient registry blips like ECONNRESET: retry more
# times over a longer backoff window than npm's default of 2. npm and pnpm both
# read these npm_config_* values.
env:
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"
  npm_config_fetch_timeout: "600000"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v6
      with:
        node-version: 26

    - name: Install dependencies
      working-directory: backend
      run: npm ci

    - name: Run tests
      working-directory: backend
      run: npm test

    - name: Build production
      working-directory: backend
      run: npm run build

    - name: Prepare deploy artifact
      working-directory: backend
      run: |
        cp package.json dist/
        cp package-lock.json dist/
        cp -r migrations dist/migrations
        cd dist && node -e "
          const pkg = require('./package.json');
          pkg.scripts = { start: 'node main.js' };
          require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
        "

    - name: Deploy to ordpool-space/cat21-backend-build
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      working-directory: backend
      # Artifact branch is `stage_prod` (underscore) — same convention as
      # the ordpool build pipelines and build-cat21-frontend.yml. Server-
      # side cat21-indexer-deploy.sh fetches origin/stage_prod.
      run: |
        npx angular-cli-ghpages \
          --repo=https://github.com/ordpool-space/cat21-backend-build.git \
          --branch=stage_prod \
          --dir=dist \
          --name="The Buildbot" \
          --email=noreply@haushoppe.art \
          --no-notfound \
          --no-nojekyll
