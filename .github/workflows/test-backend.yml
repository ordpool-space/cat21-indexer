name: Test Backend

# build-backend runs the Jest suite, but only on stage_prod, so a backend
# regression can land on main and only be caught at deploy time. This gates
# every backend push (main + stage_prod) and PR on the Jest suite + build, so
# main is protected symmetrically with the frontend (test-frontend.yml).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, stage_prod ]
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend.yml'

# Harden installs against transient registry blips like ECONNRESET: retry more
# times over a longer backoff window than npm's default of 2. npm and pnpm both
# read these npm_config_* values.
env:
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"
  npm_config_fetch_timeout: "600000"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Install dependencies
      working-directory: backend
      run: npm ci

    - name: Duplicate check (jscpd)
      working-directory: backend
      run: npm run dupes

    - name: Unit tests (Jest)
      working-directory: backend
      run: npm test -- --coverage

    - name: Build
      working-directory: backend
      run: npm run build
