name: E2E (regtest gallery, orderbook and bids — cat21-wallet)

# The public read surfaces of cat21.space on a real regtest stack: the
# address, block and sat pages over a cat cat21-ord indexed, the orderbook
# with a listing the seller publishes from the Sell modal (signed by
# cat21-wallet), and a cat's bids panel over offers buyers posted to the
# backend. The backend syncs from the real cat21-ord, so every cat the
# pages show is one the chain holds.

on:
  workflow_dispatch:
  schedule:
    - cron: '53 3 * * *'   # nightly at 03:53 UTC (offset from the other regtest runs)
  push:
    paths:
      - 'frontend/e2e/regtest/gallery-pages-regtest.e2e.spec.ts'
      - 'frontend/e2e/regtest/orderbook-bids-regtest.e2e.spec.ts'
      - 'frontend/e2e/regtest/lib/**'
      - 'frontend/playwright.regtest.config.ts'
      - 'frontend/*.json'
      - 'frontend/src/**'
      - 'backend/*.json'
      - 'backend/src/**'
      - 'backend/migrations/**'
      - 'scripts/e2e-lane.sh'
      - '.github/workflows/gallery-orderbook-regtest.yml'
  pull_request:
    paths:
      - 'frontend/e2e/regtest/gallery-pages-regtest.e2e.spec.ts'
      - 'frontend/e2e/regtest/orderbook-bids-regtest.e2e.spec.ts'
      - 'frontend/e2e/regtest/lib/**'
      - 'frontend/playwright.regtest.config.ts'
      - 'frontend/*.json'
      - 'frontend/src/**'
      - 'backend/*.json'
      - 'backend/src/**'
      - 'backend/migrations/**'
      - 'scripts/e2e-lane.sh'
      - '.github/workflows/gallery-orderbook-regtest.yml'

permissions:
  contents: read

concurrency:
  group: cat21-indexer-gallery-orderbook-regtest-${{ github.ref }}
  cancel-in-progress: false

# Harden installs against transient registry blips like ECONNRESET: retry more
# times over a longer backoff window than npm's default of 2. npm and pnpm both
# read these npm_config_* values.
env:
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"
  npm_config_fetch_timeout: "600000"

jobs:
  gallery-orderbook-regtest:
    name: Regtest gallery, orderbook and bids pages (real backend)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout cat21-indexer
        uses: actions/checkout@v4

      - name: Setup Node (frontend)
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend deps (brings ordpool-sdk into node_modules)
        working-directory: frontend
        # cat21-indexer's lockfile pins @angular/localize@21.2.17, which
        # strict-peers compiler@21.2.17 against the pinned 21.2.4, so plain
        # `npm ci` ERESOLVEs. --legacy-peer-deps loses nothing here: sats-connect
        # and @popperjs/core are direct deps of frontend/package.json.
        run: npm ci --legacy-peer-deps

      - name: Install indexer backend deps
        working-directory: backend
        run: npm ci

      # The stack's slot (ordpool-sdk e2e/stack-slots.ts): its host ports,
      # E2E_PREFIX and container names, exported to every later step. A runner
      # holds one stack, so this is slot 0. Held by the runner's worker process
      # ($PPID of a step), which lives for the job.
      - name: Acquire the regtest stack slot
        run: node frontend/node_modules/ordpool-sdk/scripts/e2e-slots.mjs acquire --kind consumer --owner-pid "$PPID" --label "gallery-orderbook-regtest" --format github | tee -a "$GITHUB_ENV"

      # ordpool-electrs, cat21-ord and cat21-wallet build from the shas this SDK
      # commit pins (e2e/build-pins.env), read from the installed package so they
      # match package-lock.json. The SDK bootstrap fails under CI on a checkout
      # at another revision.
      - name: Read the SDK's build pins
        run: grep -E '^[A-Z0-9_]+=' frontend/node_modules/ordpool-sdk/e2e/build-pins.env >> "$GITHUB_ENV"

      # OUR electrs: the consumer-environment compose builds it from the
      # ordpool-electrs fork; ELECTRS_SRC points its build context here.
      - name: Checkout ordpool-electrs (for the electrs container)
        uses: actions/checkout@v4
        with:
          repository: ordpool-space/ordpool-electrs
          ref: ${{ env.ORDPOOL_ELECTRS_SHA }}
          path: ordpool-electrs

      # cat21-ord and the stock ord both build from this checkout (ORD_SRC
      # falls back to CAT21_ORD_SRC in the compose).
      - name: Checkout cat21-ord (for the ord containers)
        uses: actions/checkout@v4
        with:
          repository: ordpool-space/cat21-ord
          ref: ${{ env.CAT21_ORD_SHA }}
          path: cat21-ord

      # buildx gha cache: reuse the compiled Rust images across runs. A
      # docker-container builder + the Actions runtime env make type=gha work;
      # the .dockerignore keeps each checkout's volatile .git/ out of the COPY
      # layer so it cache-hits.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Export GitHub Actions runtime for the gha cache backend
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Stabilise the Rust build contexts for layer caching
        run: |
          printf '.git\ntarget\n' > ordpool-electrs/.dockerignore
          printf '.git\ntarget\n' > cat21-ord/.dockerignore

      # The SDK harness (extension staging) comes from the
      # same ordpool-sdk sha the frontend's package-lock.json pins.
      - name: Read the pinned ordpool-sdk sha
        id: sdk-pin
        run: |
          sha=$(jq -r '.packages["node_modules/ordpool-sdk"].resolved' frontend/package-lock.json | sed 's/.*#//')
          echo "$sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "no full ordpool-sdk sha in frontend/package-lock.json: $sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout ordpool-sdk (for the wallet extension)
        uses: actions/checkout@v4
        with:
          repository: ordpool-space/ordpool-sdk
          path: sdk
          ref: ${{ steps.sdk-pin.outputs.sha }}

      - name: Setup Node (sdk)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'sdk/package-lock.json'

      - name: Install SDK deps + build
        working-directory: sdk
        run: |
          npm ci
          npm run build

      - name: Install Playwright system deps + Chromium (sdk)
        working-directory: sdk
        run: npx playwright install --with-deps chromium

      - name: Checkout cat21-wallet (extension source)
        uses: actions/checkout@v4
        with:
          repository: ordpool-space/cat21-wallet
          path: cat21-wallet-src
          ref: ${{ env.CAT21_WALLET_SHA }}

      - name: Setup pnpm for cat21-wallet build
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Cache cat21-wallet pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: cat21wallet-pnpm-${{ hashFiles('cat21-wallet-src/pnpm-lock.yaml') }}
          restore-keys: |
            cat21wallet-pnpm-

      - name: Cache cat21-wallet extension dist
        id: cat21wallet-dist-cache
        uses: actions/cache@v4
        with:
          path: cat21-wallet-src/apps/extension/dist
          key: cat21wallet-dist-${{ env.CAT21_WALLET_SHA }}

      - name: Install cat21-wallet dependencies
        if: steps.cat21wallet-dist-cache.outputs.cache-hit != 'true'
        working-directory: cat21-wallet-src
        run: pnpm install --frozen-lockfile

      - name: Build cat21-wallet extension
        if: steps.cat21wallet-dist-cache.outputs.cache-hit != 'true'
        working-directory: cat21-wallet-src
        run: pnpm build:extension

      - name: Stage cat21-wallet extension via SDK bootstrap (LOCAL_DIST mode)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAT21_WALLET_LOCAL_DIST: ${{ github.workspace }}/cat21-wallet-src/apps/extension/dist
        working-directory: sdk
        run: bash e2e/playwright/playwright-bootstrap.sh cat21wallet

      - name: Install Playwright in the frontend tree
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # scripts/e2e-lane.sh: the stack in this slot, the SDK's fees stub, the
      # frontend built against the stack and served on E2E_APP_PORT, the
      # backend on E2E_APP_BACKEND_PORT, the specs, then the net-log check
      # (nothing left the machine). A local run executes the same script
      # through `e2e-slots.mjs run --kind consumer`.
      - name: Run the gallery and orderbook lane
        env:
          ELECTRS_SRC: ${{ github.workspace }}/ordpool-electrs
          CAT21_ORD_SRC: ${{ github.workspace }}/cat21-ord
          E2E_BUILDX_CACHE: '1'
          E2E_SDK_DIR: ${{ github.workspace }}/sdk
          E2E_LANE_DIR: ${{ github.workspace }}/lane
          CAT21WALLET_EXT_PATH: ${{ github.workspace }}/sdk/e2e/extensions/cat21wallet
        run: |
          scripts/e2e-lane.sh --wallet cat21wallet --with-cat21-ord --with-ord-stock --scan real -- \
            e2e/regtest/gallery-pages-regtest.e2e.spec.ts \
            e2e/regtest/orderbook-bids-regtest.e2e.spec.ts

      - name: Dump container and process logs on failure
        if: failure() && env.E2E_SLOT != ''
        run: |
          for service in bitcoind electrs mariadb cat21-ord ord-stock; do
            echo "===== $E2E_PREFIX-consumer-$service ====="
            docker logs "$E2E_PREFIX-consumer-$service" --tail 100 2>&1 || echo "(no container $E2E_PREFIX-consumer-$service)"
          done
          for log in lane/indexer-backend.log lane/fees-stub.log lane/serve.log; do
            echo "===== $log ====="
            tail -200 "$log" 2>/dev/null || echo "(no $log)"
          done

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-orderbook-regtest-playwright-${{ github.run_id }}
          path: |
            frontend/test-results
            frontend/playwright-report-regtest
            lane/net-log
            lane/*.log
          retention-days: 14
          if-no-files-found: warn

      # Tears the slot's compose projects down by name and releases the slot.
      - name: Tear down
        if: always() && env.E2E_SLOT != ''
        run: node frontend/node_modules/ordpool-sdk/scripts/e2e-slots.mjs down "$E2E_SLOT" --force
