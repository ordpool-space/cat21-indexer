name: E2E (regtest funding-safety guard)

# Proves the funding-safety guard REFUSES an asset-bearing coin as a mint fee,
# against REAL ords (no /output mock). Separate from e2e-regtest-mint.yml because
# it needs a different config: the scanner's ordApiUrl points at the STOCK ord
# (real inscriptions field) and cat21OrdApiUrl at cat21-ord (cats),
# whereas the mint spec points both at the fees stub and mocks /output. Keeping
# them apart leaves the green mint suite untouched.
#
#   bitcoind + electrs + mariadb + cat21-ord + ord-stock
#   + the SDK's fees/electrs stub
#   + cat21-indexer/frontend served with ordApiUrl -> stock ord, cat21OrdApiUrl -> cat21-ord
#   + Xverse extension headed in xvfb
#   + Playwright drives /dashboard/mint: a real inscribed coin is refused, and
#     the warning panel names the inscription (the load-bearing assertion).

on:
  workflow_dispatch:
  schedule:
    - cron: '57 3 * * *'   # nightly (offset from the other regtest runs)
  push:
    paths:
      - 'frontend/e2e/regtest/funding-guard-inscription-regtest.e2e.spec.ts'
      - 'frontend/e2e/regtest/lib/**'
      - 'frontend/playwright.regtest.config.ts'
      - 'frontend/*.json'
      - 'frontend/src/**'
      - 'backend/*.json'
      - 'backend/src/**'
      - 'backend/migrations/**'
      - 'scripts/e2e-lane.sh'
      - '.github/workflows/funding-guard-regtest.yml'
  pull_request:
    paths:
      - 'frontend/e2e/regtest/funding-guard-inscription-regtest.e2e.spec.ts'
      - 'frontend/e2e/regtest/lib/**'
      - 'frontend/playwright.regtest.config.ts'
      - 'frontend/*.json'
      - 'frontend/src/**'
      - 'backend/*.json'
      - 'backend/src/**'
      - 'backend/migrations/**'
      - 'scripts/e2e-lane.sh'
      - '.github/workflows/funding-guard-regtest.yml'

permissions:
  contents: read

concurrency:
  group: cat21-indexer-funding-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  funding-guard:
    name: Regtest funding-safety guard (real ord, no mock)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout cat21-indexer
        uses: actions/checkout@v4

      - name: Setup Node (frontend)
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend deps (brings ordpool-sdk into node_modules)
        working-directory: frontend
        # cat21-indexer's lockfile pins @angular/localize@21.2.17, which
        # strict-peers compiler@21.2.17 against the pinned 21.2.4, so plain
        # `npm ci` ERESOLVEs. --legacy-peer-deps loses nothing here: sats-connect
        # and @popperjs/core are direct deps of frontend/package.json.
        run: npm ci --legacy-peer-deps

      - name: Install indexer backend deps
        working-directory: backend
        run: npm ci

      # The stack's slot (ordpool-sdk e2e/stack-slots.ts): its host ports,
      # E2E_PREFIX and container names, exported to every later step. A runner
      # holds one stack, so this is slot 0. Held by the runner's worker process
      # ($PPID of a step), which lives for the job.
      - name: Acquire the regtest stack slot
        run: node frontend/node_modules/ordpool-sdk/scripts/e2e-slots.mjs acquire --kind consumer --owner-pid "$PPID" --label "funding-guard" --format github | tee -a "$GITHUB_ENV"

      # ordpool-electrs, cat21-ord and cat21-wallet build from the shas this SDK
      # commit pins (e2e/build-pins.env), read from the installed package so they
      # match package-lock.json. The SDK bootstrap fails under CI on a checkout
      # at another revision.
      - name: Read the SDK's build pins
        run: grep -E '^[A-Z0-9_]+=' frontend/node_modules/ordpool-sdk/e2e/build-pins.env >> "$GITHUB_ENV"

      # OUR electrs: the consumer-environment compose builds it from the
      # ordpool-electrs fork; ELECTRS_SRC points its build context here.
      - name: Checkout ordpool-electrs (for the electrs container)
        uses: actions/checkout@v4
        with:
          repository: ordpool-space/ordpool-electrs
          ref: ${{ env.ORDPOOL_ELECTRS_SHA }}
          path: ordpool-electrs

      # cat21-ord and the stock ord both build from this checkout (ORD_SRC
      # falls back to CAT21_ORD_SRC in the compose).
      - name: Checkout cat21-ord (for the ord containers)
        uses: actions/checkout@v4
        with:
          repository: ordpool-space/cat21-ord
          ref: ${{ env.CAT21_ORD_SHA }}
          path: cat21-ord

      # buildx gha cache: reuse the compiled Rust images across runs. A
      # docker-container builder + the Actions runtime env make type=gha work;
      # the .dockerignore keeps each checkout's volatile .git/ out of the COPY
      # layer so it cache-hits.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Export GitHub Actions runtime for the gha cache backend
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Stabilise the Rust build contexts for layer caching
        run: |
          printf '.git\ntarget\n' > ordpool-electrs/.dockerignore
          printf '.git\ntarget\n' > cat21-ord/.dockerignore

      # The SDK harness (extension staging, Xverse onboarding) comes from the
      # same ordpool-sdk sha the frontend's package-lock.json pins.
      - name: Read the pinned ordpool-sdk sha
        id: sdk-pin
        run: |
          sha=$(jq -r '.packages["node_modules/ordpool-sdk"].resolved' frontend/package-lock.json | sed 's/.*#//')
          echo "$sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "no full ordpool-sdk sha in frontend/package-lock.json: $sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout ordpool-sdk (for the wallet extension and the Xverse onboarding)
        uses: actions/checkout@v4
        with:
          repository: ordpool-space/ordpool-sdk
          path: sdk
          ref: ${{ steps.sdk-pin.outputs.sha }}

      - name: Setup Node (sdk)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'sdk/package-lock.json'

      - name: Install SDK deps + build
        working-directory: sdk
        run: |
          npm ci
          npm run build

      - name: Install Playwright system deps + Chromium (sdk)
        working-directory: sdk
        run: npx playwright install --with-deps chromium

      - name: Cache unpacked Xverse extension
        id: xverse-cache
        uses: actions/cache@v4
        with:
          path: sdk/e2e/extensions/xverse
          key: xverse-extension-v2.3.2

      - name: Download + unpack Xverse from SDK release mirror
        if: steps.xverse-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: sdk
        run: bash e2e/playwright/playwright-bootstrap.sh xverse

      - name: Install Playwright in the frontend tree
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # scripts/e2e-lane.sh: the stack in this slot, the SDK's fees stub, the
      # frontend built against the stack and served on E2E_APP_PORT, the
      # backend on E2E_APP_BACKEND_PORT, the specs, then the net-log check
      # (nothing left the machine). A local run executes the same script
      # through `e2e-slots.mjs run --kind consumer`.
      - name: Run the funding-guard lane
        env:
          ELECTRS_SRC: ${{ github.workspace }}/ordpool-electrs
          CAT21_ORD_SRC: ${{ github.workspace }}/cat21-ord
          E2E_BUILDX_CACHE: '1'
          E2E_SDK_DIR: ${{ github.workspace }}/sdk
          E2E_LANE_DIR: ${{ github.workspace }}/lane
          XVERSE_EXT_PATH: ${{ github.workspace }}/sdk/e2e/extensions/xverse
        run: |
          scripts/e2e-lane.sh --wallet xverse --with-cat21-ord --with-ord-stock --scan real -- \
            e2e/regtest/funding-guard-inscription-regtest.e2e.spec.ts

      - name: Dump container and process logs on failure
        if: failure() && env.E2E_SLOT != ''
        run: |
          for service in bitcoind electrs mariadb cat21-ord ord-stock; do
            echo "===== $E2E_PREFIX-consumer-$service ====="
            docker logs "$E2E_PREFIX-consumer-$service" --tail 100 2>&1 || echo "(no container $E2E_PREFIX-consumer-$service)"
          done
          for log in lane/indexer-backend.log lane/fees-stub.log lane/serve.log; do
            echo "===== $log ====="
            tail -200 "$log" 2>/dev/null || echo "(no $log)"
          done

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-guard-playwright-${{ github.run_id }}
          path: |
            frontend/test-results
            frontend/playwright-report-regtest
            lane/net-log
            lane/*.log
          retention-days: 14
          if-no-files-found: warn

      # Tears the slot's compose projects down by name and releases the slot.
      - name: Tear down
        if: always() && env.E2E_SLOT != ''
        run: node frontend/node_modules/ordpool-sdk/scripts/e2e-slots.mjs down "$E2E_SLOT" --force
