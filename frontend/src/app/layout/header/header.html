<nav class="header-nav">
  <a routerLink="/" class="brand" aria-label="CAT-21 — home" data-testid="brand-home">
    <img ngSrc="genesis-cat.svg" width="44" height="44" alt="" priority class="brand-cat" />
    <span class="brand-word">CAT-21</span>
  </a>

  <!-- The nav links. Inline on desktop; a full-width dropdown behind the burger
       on mobile (CSS orders it below the brand + actions row). The Connect
       control is NOT in here: on mobile it stays out on the top row. -->
  <div id="primary-nav" class="nav-links" [class.is-open]="menuOpen()">
    <a routerLink="/dashboard/mint" routerLinkActive="nav-link-active" class="nav-link" data-testid="nav-mint" (click)="closeMenu()">Mint</a>
    <a routerLink="/search" routerLinkActive="nav-link-active" class="nav-link" data-testid="nav-search" (click)="closeMenu()">Search</a>
    <a routerLink="/orderbook" routerLinkActive="nav-link-active" class="nav-link" data-testid="nav-orderbook" (click)="closeMenu()">Orderbook</a>
    @if (connectedWallet()) {
      <a routerLink="/dashboard" routerLinkActive="nav-link-active" class="nav-link" data-testid="nav-dashboard" (click)="closeMenu()">Dashboard</a>
    }
    <a routerLink="/about" routerLinkActive="nav-link-active" class="nav-link" data-testid="nav-about" (click)="closeMenu()">About</a>
  </div>

  <!-- Always on the top row: the connect control and (mobile only) the burger.
       Connect stays reachable in one tap on every screen; only the nav links
       collapse behind the burger. -->
  <div class="header-actions">
    <app-wallet-connect />
    <button
      type="button"
      class="nav-toggle"
      [class.is-open]="menuOpen()"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-nav"
      aria-label="Menu"
      data-testid="nav-toggle">
      <span class="nav-toggle-bar" aria-hidden="true"></span>
      <span class="nav-toggle-bar" aria-hidden="true"></span>
      <span class="nav-toggle-bar" aria-hidden="true"></span>
    </button>
  </div>
</nav>
